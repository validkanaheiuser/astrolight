<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astrolight · Lucky65</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="booting" data-view="lighting" data-scope="board">

<div id="intro" class="intro" role="status">
  <img src="logo.svg" alt="Astrolight">
  <p id="intro-status" data-i18n="intro.searching"></p>
  <button id="intro-skip" data-i18n="intro.skip"></button>
</div>

<aside class="rail">
  <div class="brand"><img src="logo.svg" alt="Astrolight"></div>
  <nav data-i18n-attr="aria-label:nav.label">
    <button data-page="lighting" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span data-i18n="nav.lighting"></span></button>
    <button data-page="remap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h1m3 0h1m3 0h1m3 0h.1M6 13h1m3 0h1m3 0h1m3 0h.1M7 16h10"/></svg><span data-i18n="nav.remap"></span></button>
    <button data-page="macros"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h7"/><circle cx="18" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg><span data-i18n="nav.macros"></span></button>
    <button data-page="profiles"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M14 17.5h7m-3.5-3.5v7"/></svg><span data-i18n="nav.profiles"></span></button>
    <button data-page="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg><span data-i18n="nav.settings"></span></button>
  </nav>
  <div class="rail-foot">
    <div class="device"><span class="dot" id="dot"></span><div><strong>Lucky65 3M</strong><small id="connection"></small></div></div>
    <label class="lang"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><select id="language-quick" data-i18n-attr="aria-label:settings.language"></select></label>
    <small class="version">Astrolight 3.3</small>
  </div>
</aside>

<div class="shell">
<header class="topbar">
  <div class="title"><h1 id="page-title"></h1><p id="page-description"></p></div>
  <div class="topbar-actions">
    <span id="active-profile" class="chip"></span>
    <span id="caps-state" class="chip" hidden></span>
    <span id="native-fps" class="chip"></span>
    <button id="quick-play" class="primary"></button>
    <button id="connect"></button>
  </div>
</header>

<main>
<div id="studio" class="studio">
  <div class="studio-main">
    <section class="stage" data-i18n-attr="aria-label:stage.label">
      <div class="stage-bar">
        <div id="scope-tabs" class="segmented" role="group" data-i18n-attr="aria-label:scope.label">
          <button data-scope="board" class="active" aria-pressed="true" data-i18n="scope.board"></button>
          <button data-scope="keys" aria-pressed="false" data-i18n="scope.keys"></button>
        </div>
        <div id="layer-tabs" class="segmented" role="group" hidden>
          <button data-layer="0" class="active" aria-pressed="true">Base</button>
          <button data-layer="1" aria-pressed="false">Fn 1</button>
          <button data-layer="2" aria-pressed="false">Fn 2</button>
        </div>
        <span class="live" id="live"><i></i><span id="live-label"></span></span>
        <label class="inline"><span data-i18n="stage.layout"></span>
          <select id="layout">
            <option value="3" data-i18n="layout.3"></option>
            <option value="2" data-i18n="layout.2"></option>
            <option value="1" data-i18n="layout.1"></option>
            <option value="0" data-i18n="layout.0"></option>
          </select>
        </label>
      </div>
      <div class="keyboard-scroll" tabindex="-1">
        <div class="keyboard-wrap"><div id="keyboard" class="keyboard"><canvas id="lights" aria-hidden="true"></canvas></div></div>
      </div>
      <div id="select-tools" class="chips" hidden>
        <button data-select="all" data-i18n="select.all"></button>
        <button data-select="letters" data-i18n="select.letters"></button>
        <button data-select="numbers" data-i18n="select.numbers"></button>
        <button data-select="wasd">WASD</button>
        <button data-select="arrows" data-i18n="select.arrows"></button>
        <button data-select="mods" data-i18n="select.mods"></button>
        <button data-select="custom" data-i18n="select.custom"></button>
        <button data-select="invert" data-i18n="select.invert"></button>
        <button data-select="none" data-i18n="select.none"></button>
      </div>
      <div class="stage-foot"><span id="keyhint"></span><span id="frames"></span></div>
    </section>

    <section id="page-lighting" class="page">
      <div class="section-head">
        <div><h2 data-i18n="library.title"></h2><p id="library-hint"></p></div>
        <button id="tour"></button>
      </div>
      <div class="library-tools">
        <input type="search" id="effect-search" data-i18n-attr="placeholder:library.search;aria-label:library.search">
        <div id="effect-filters" class="chips" role="group" data-i18n-attr="aria-label:library.filters">
          <button data-filter="all" class="active" aria-pressed="true" data-i18n="filter.all"></button>
          <button data-filter="new" aria-pressed="false" data-i18n="filter.new"></button>
          <button data-filter="reactive" aria-pressed="false" data-i18n="filter.reactive"></button>
          <button data-filter="calm" aria-pressed="false" data-i18n="filter.calm"></button>
          <button data-filter="geometry" aria-pressed="false" data-i18n="filter.geometry"></button>
          <button data-filter="energy" aria-pressed="false" data-i18n="filter.energy"></button>
          <button data-filter="static" aria-pressed="false" data-i18n="filter.static"></button>
        </div>
        <small id="effect-count" aria-live="polite"></small>
      </div>
      <p id="effect-empty" class="empty" hidden data-i18n="library.empty"></p>
      <div id="effects" class="effect-grid"></div>

      <div class="panel presets">
        <div class="section-head"><div><h2 data-i18n="presets.title"></h2><p data-i18n="presets.hint"></p></div><button id="import" data-i18n="presets.import"></button></div>
        <div class="save-row">
          <label><span data-i18n="presets.name"></span><input id="preset-name" maxlength="60"></label>
          <button id="save" class="primary" data-i18n="presets.save"></button>
          <button id="export" data-i18n="presets.export"></button>
          <button id="delete" data-i18n="presets.delete"></button>
        </div>
        <div id="presets" class="preset-list"></div>
      </div>
    </section>

    <section id="page-remap" class="page" hidden>
      <div class="section-head">
        <div><h2 data-i18n="remap.pick"></h2><p id="assignment-hint"></p></div>
        <span id="keycode-count" class="chip"></span>
      </div>
      <div class="library-tools">
        <div class="chips" id="keycode-tabs" role="group" data-i18n-attr="aria-label:remap.groups">
          <button data-group="Basic" class="active" aria-pressed="true" data-i18n="group.Basic"></button>
          <button data-group="Media" aria-pressed="false" data-i18n="group.Media"></button>
          <button data-group="Mouse" aria-pressed="false" data-i18n="group.Mouse"></button>
          <button data-group="Special" aria-pressed="false" data-i18n="group.Special"></button>
          <button data-group="Macro" aria-pressed="false" data-i18n="group.Macro"></button>
        </div>
        <input id="key-search" type="search" data-i18n-attr="placeholder:remap.search;aria-label:remap.search">
      </div>
      <div id="keycodes" class="keycode-grid"></div>
      <p id="keycode-description" class="hint" aria-live="polite"></p>
    </section>
  </div>

  <aside id="lighting-inspector" class="inspector" data-i18n-attr="aria-label:inspector.label">
    <section>
      <div class="section-head tight"><h2 id="effect-name"></h2><span id="mode-tag" class="chip"></span></div>
      <p id="selection-summary" class="hint keys-only"></p>
      <div class="colors">
        <label class="color"><input type="color" id="colorA"><span><span data-i18n="color.a"></span><input id="hexA" maxlength="7" spellcheck="false" data-i18n-attr="aria-label:color.aHex"></span></label>
        <button id="swap" class="icon" data-i18n-attr="aria-label:color.swap;title:color.swap">⇄</button>
        <label class="color"><input type="color" id="colorB"><span><span data-i18n="color.b"></span><input id="hexB" maxlength="7" spellcheck="false" data-i18n-attr="aria-label:color.bHex"></span></label>
      </div>
      <div id="swatches" class="swatches"></div>
      <div id="paint-tools" class="button-row board-only" hidden>
        <button id="fill" data-i18n="paint.fill"></button>
        <button id="wasd">WASD</button>
        <button id="arrows" data-i18n="select.arrows"></button>
        <button id="clear" data-i18n="paint.clear"></button>
      </div>
      <div class="sliders">
        <label class="board-only"><span data-i18n="slider.brightness"></span><output id="brightness-value"></output><input type="range" id="brightness" min="0" max="100"></label>
        <label><span data-i18n="slider.speed"></span><output id="speed-value"></output><input type="range" id="speed" min="1" max="100"></label>
        <label class="board-only"><span data-i18n="slider.scale"></span><output id="scale-value"></output><input type="range" id="scale" min="1" max="100"></label>
        <label class="board-only"><span data-i18n="slider.angle"></span><output id="angle-value"></output><input type="range" id="angle" min="-180" max="180"></label>
      </div>
      <div class="button-col keys-only">
        <button id="key-follow" data-i18n="keys.followAction"></button>
        <button id="key-clear-all" class="quiet" data-i18n="keys.clearAll"></button>
      </div>
      <p id="reactive-hint" class="hint" hidden data-i18n="reactive.hint"></p>
    </section>
    <section>
      <h2 data-i18n="play.title"></h2>
      <label class="field"><span data-i18n="play.fps"></span>
        <select id="fps">
          <option value="30" data-i18n="fps.30"></option>
          <option value="15" data-i18n="fps.15"></option>
          <option value="60" data-i18n="fps.60"></option>
        </select>
      </label>
      <div class="button-row">
        <button id="start" class="primary" data-i18n="play.start"></button>
        <button id="stop" data-i18n="play.stop"></button>
      </div>
      <button id="static" class="wide" data-i18n="play.static"></button>
      <p class="hint" data-i18n="play.hint"></p>
      <details>
        <summary data-i18n="fw.title"></summary>
        <div class="form-grid">
          <label class="span"><span data-i18n="fw.effect"></span><select id="fw-effect"></select></label>
          <label><span data-i18n="fw.brightness"></span><select id="fw-brightness"><option value="4">100%</option><option value="3">75%</option><option value="2">50%</option><option value="1">25%</option><option value="0" data-i18n="fw.off"></option></select></label>
          <label><span data-i18n="slider.speed"></span><select id="fw-speed"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
        </div>
        <button id="fw-apply" class="wide" data-i18n="fw.apply"></button>
        <p class="hint" data-i18n="fw.hint"></p>
      </details>
    </section>
  </aside>

  <aside id="remap-inspector" class="inspector" hidden data-i18n-attr="aria-label:remap.inspector">
    <section>
      <div class="section-head tight"><h2 data-i18n="remap.selected"></h2><span id="binding-type" class="chip"></span></div>
      <div class="keycap-art" aria-hidden="true"><span id="selected-key-glyph">?</span><small id="selected-key-origin"></small></div>
      <h3 id="selected-key"></h3>
      <p id="binding-label" class="hint"></p>
      <label class="field"><span data-i18n="remap.position"></span><select id="key-position"></select></label>
      <div class="button-row">
        <button id="key-previous" data-i18n="remap.prev"></button>
        <button id="key-next" data-i18n="remap.next"></button>
      </div>
    </section>
    <section>
      <h3 data-i18n="remap.combo"></h3>
      <p class="hint" data-i18n="remap.comboHint"></p>
      <fieldset id="modifier-options" class="modifiers" disabled>
        <legend class="sr-only" data-i18n="remap.combo"></legend>
        <label><input type="checkbox" data-mod="1">Ctrl</label>
        <label><input type="checkbox" data-mod="2">Shift</label>
        <label><input type="checkbox" data-mod="4">Alt</label>
        <label><input type="checkbox" data-mod="8">Win</label>
      </fieldset>
      <button id="key-default" class="wide" disabled data-i18n="remap.restore"></button>
    </section>
    <section>
      <div class="section-head tight"><h3 data-i18n="remap.customized"></h3><span id="map-count" class="chip">0</span></div>
      <div id="map-changes" class="map-changes"></div>
      <details>
        <summary data-i18n="remap.layerOptions"></summary>
        <label class="field"><span data-i18n="remap.fnDefault"></span><select id="fn-mode"><option value="0">Fn 1</option><option value="1">Fn 2</option></select></label>
        <button id="layer-reset" class="wide" data-i18n="remap.resetLayer"></button>
        <button id="map-reset" class="wide danger" data-i18n="remap.resetAll"></button>
        <p class="hint" data-i18n="remap.defaultHint"></p>
      </details>
    </section>
  </aside>

  <div id="remap-commit" class="commit" hidden>
    <div class="draft-state"><strong id="map-dirty" role="status"></strong><small id="map-device-state"></small></div>
    <div class="button-row">
      <button id="map-undo" disabled data-i18n="remap.undo" data-i18n-attr="title:remap.undoTitle"></button>
      <button id="map-redo" disabled data-i18n="remap.redo" data-i18n-attr="title:remap.redoTitle"></button>
    </div>
    <div class="button-row">
      <button id="map-save" data-i18n="remap.save"></button>
      <button id="map-apply" class="primary" data-i18n="remap.apply"></button>
    </div>
    <p class="hint" data-i18n="remap.commitNote"></p>
  </div>
</div>

<section id="page-macros" class="page" hidden>
  <div class="macro-workbench">
    <section class="panel">
      <div class="section-head"><h2 data-i18n="macro.yours"></h2><button id="macro-new" data-i18n="macro.add"></button></div>
      <div id="macro-list" class="macro-list"></div>
      <p class="hint" data-i18n="macro.limits"></p>
    </section>
    <section class="panel">
      <div id="macro-empty" class="empty" data-i18n="macro.empty"></div>
      <div id="macro-editor" hidden>
        <div class="form-grid">
          <label><span data-i18n="macro.name"></span><input id="macro-name" maxlength="60"></label>
          <label><span data-i18n="macro.repeat"></span><input id="macro-repeat" type="number" min="1" max="1000" value="1"></label>
        </div>
        <div class="button-row record-row">
          <button id="record-start" data-i18n="macro.record"></button>
          <button id="record-stop" disabled data-i18n="macro.recordStop"></button>
          <button id="macro-add-step" data-i18n="macro.addStep"></button>
          <span id="macro-count" class="chip">0 / 84</span>
        </div>
        <div id="record-area" tabindex="0" class="record-area" role="textbox" data-i18n-attr="aria-label:macro.recordArea"></div>
        <div class="table-scroll"><table>
          <thead><tr><th>#</th><th data-i18n="macro.action"></th><th data-i18n="macro.key"></th><th data-i18n="macro.delay"></th><th></th></tr></thead>
          <tbody id="macro-steps"></tbody>
        </table></div>
        <div class="button-row">
          <button id="macro-save" class="primary" data-i18n="remap.save"></button>
          <button id="macro-delete" class="danger" data-i18n="macro.delete"></button>
        </div>
        <p class="hint" data-i18n="macro.hint"></p>
      </div>
    </section>
  </div>
</section>

<section id="page-profiles" class="page" hidden>
  <div class="panel">
    <div class="section-head">
      <div><h2 data-i18n="profiles.title"></h2><p id="foreground-info"></p></div>
      <label class="switch"><span data-i18n="profiles.auto"></span><input type="checkbox" id="auto-profiles"></label>
    </div>
    <div class="form-grid rule-form">
      <label><span data-i18n="profiles.name"></span><input id="rule-name" maxlength="60" data-i18n-attr="placeholder:profiles.namePlaceholder"></label>
      <label><span data-i18n="profiles.exe"></span><span class="input-action"><input id="rule-exe" placeholder="game.exe" spellcheck="false"><button id="choose-exe" data-i18n-attr="aria-label:profiles.browse;title:profiles.browse">…</button></span></label>
      <label><span data-i18n="profiles.lighting"></span><select id="rule-preset"></select></label>
      <button id="rule-add" class="primary" data-i18n="profiles.add"></button>
    </div>
    <div id="rules" class="rules"></div>
    <p class="hint" data-i18n="profiles.hint"></p>
  </div>
</section>

<section id="page-settings" class="page" hidden>
  <div class="settings-grid">
    <section class="panel">
      <h2 data-i18n="settings.general"></h2>
      <label class="switch"><span data-i18n="settings.language"></span><select id="language"></select></label>
      <label class="switch"><span data-i18n="settings.startup"></span><input type="checkbox" id="startup"></label>
      <label class="switch"><span data-i18n="settings.logoMotion"></span><input type="checkbox" id="logo-motion"></label>
      <p class="hint" data-i18n="settings.startupHint"></p>
    </section>
    <section class="panel">
      <h2 data-i18n="settings.priority"></h2>
      <label class="switch"><span data-i18n="settings.priorityToggle"></span><input type="checkbox" id="typing-priority"></label>
      <p class="hint" data-i18n="settings.priorityHint"></p>
      <label class="field"><span data-i18n="settings.typingTest"></span><input id="typing-test" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:settings.typingPlaceholder"></label>
      <p id="input-state" class="hint" role="status"></p>
    </section>
    <section class="panel">
      <h2 data-i18n="settings.intro"></h2>
      <label class="switch"><span data-i18n="settings.introToggle"></span><input type="checkbox" id="opt-intro"></label>
      <div class="form-grid">
        <label><span data-i18n="settings.introEffect"></span><select id="intro-mode"></select></label>
        <label><span data-i18n="settings.introSeconds"></span><input id="intro-seconds" type="number" min="0.5" max="10" step="0.1"></label>
      </div>
      <label class="switch"><span data-i18n="settings.autoPlay"></span><input type="checkbox" id="auto-play"></label>
      <p class="hint" data-i18n="settings.introHint"></p>
    </section>
    <section class="panel">
      <h2 data-i18n="settings.caps"></h2>
      <label class="switch"><span data-i18n="settings.capsToggle"></span><input type="checkbox" id="caps-enabled"></label>
      <div class="colors plain">
        <label class="color"><input type="color" id="caps-on"><span data-i18n="settings.capsOn"></span></label>
        <label class="color"><input type="color" id="caps-off"><span data-i18n="settings.capsOff"></span></label>
      </div>
      <label class="switch"><span data-i18n="settings.capsBase"></span><input type="checkbox" id="caps-off-base"></label>
      <p class="hint" data-i18n="settings.capsHint"></p>
    </section>
    <section class="panel">
      <h2 data-i18n="settings.backup"></h2>
      <p data-i18n="settings.backupCopy"></p>
      <div class="button-row">
        <button id="workspace-export" data-i18n="settings.export"></button>
        <button id="workspace-import" data-i18n="settings.import"></button>
      </div>
      <p class="hint" data-i18n="settings.backupHint"></p>
    </section>
  </div>
</section>
</main>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<dialog id="confirm-dialog">
  <h2 id="confirm-title"></h2>
  <p id="confirm-copy"></p>
  <div id="confirm-details"></div>
  <div class="button-row end"><button id="confirm-cancel" data-i18n="common.cancel"></button><button id="confirm-accept" class="primary"></button></div>
</dialog>

<script src="i18n.js"></script>
<script src="effects.js"></script>
<script src="app.js"></script>
</body>
</html>
